<div class="modal-container" *ngIf="config.visible">
  <h2>{{ config.titulo }}</h2>

  <div *ngIf="config.modo === 'eliminar'; else mostrarFormulario">
    <p>¿Estás seguro de que deseas eliminar el producto <strong>{{ config.producto?.descripcion }}</strong>?</p>
    <div class="form-actions">
      <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      <button type="button" class="btn-eliminar" (click)="guardar()">Eliminar</button>
    </div>
  </div>

  <ng-template #mostrarFormulario>
    <form [formGroup]="form" (ngSubmit)="guardar()">
      
      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <input 
          id="descripcion" 
          type="text" 
          formControlName="descripcion" 
          placeholder="Ej. Café Americano Intenso 12oz"
        />
        <small class="error-text" *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched">
          La descripción es obligatoria.
        </small>
      </div>

      <div class="form-group">
        <label for="precioUnitario">Precio Unitario</label>
        <input 
          id="precioUnitario" 
          type="number" 
          step="0.01"
          formControlName="precioUnitario" 
          placeholder="0.00"
        />
        <small class="error-text" *ngIf="form.get('precioUnitario')?.invalid && form.get('precioUnitario')?.touched">
          El precio debe ser mayor a 0.
        </small>
      </div>

      <div class="form-group">
        <label for="stock">Stock</label>
        <input 
          id="stock" 
          type="number" 
          formControlName="stock" 
          placeholder="0"
        />
        <small class="error-text" *ngIf="form.get('stock')?.invalid && form.get('stock')?.touched">
          El stock no puede ser negativo.
        </small>
      </div>

      <div class="form-group">
        <label for="codigo">Código de Barras</label>
        <input 
          id="codigo" 
          type="text" 
          formControlName="codigo" 
          placeholder="Ej. 7501234567890"
        />
        <small class="error-text" *ngIf="form.get('codigo')?.invalid && form.get('codigo')?.touched">
          El código de barras es obligatorio.
        </small>
      </div>

      <div class="form-group">
        <label for="image">URL de la Imagen</label>
        <input 
          id="image" 
          type="text" 
          formControlName="image" 
          placeholder="https://ejemplo.com/imagen.jpg"
        />
      </div>

      <div class="form-group">
        <label for="idMarca">Marca</label>
        <select id="idMarca" formControlName="idMarca">
          <option [ngValue]="null" disabled selected>Seleccione una Marca</option>
          <option *ngFor="let marca of marcas" [value]="marca.idMarca">
            {{ marca.descripcion }}
          </option>
        </select>
        <small class="error-text" *ngIf="form.get('idMarca')?.invalid && form.get('idMarca')?.touched">
          Debes seleccionar una marca.
        </small>
      </div>

      <div class="form-group">
        <label for="idCategoria">Categoría</label>
        <select id="idCategoria" formControlName="idCategoria">
          <option [ngValue]="null" disabled selected>Seleccione una Categoría</option>
          <option *ngFor="let cat of categorias" [value]="cat.idCategoria">
            {{ cat.descripcion }}
          </option>
        </select>
        <small class="error-text" *ngIf="form.get('idCategoria')?.invalid && form.get('idCategoria')?.touched">
          Debes seleccionar una categoría.
        </small>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-guardar" [disabled]="form.invalid">
          {{ config.modo === 'crear' ? 'Crear' : 'Guardar Cambios' }}
        </button>
      </div>

    </form>
  </ng-template>
</div>
