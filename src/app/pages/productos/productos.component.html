<div class="container">
    <div class="header-section">
        <h1>Productos</h1>
        <button class="btn-add" (click)="nuevoProducto()">+ NUEVO PRODUCTO</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DESCRIPCIÓN</th> <th>PRECIO</th>
                    <th>STOCK</th>
                    <th>MARCA</th>
                    <th>CATEGORÍA</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let prod of listaProductos">
                    <td>{{prod.descripcion}}</td>
                    <td>{{prod.precioUnitario | currency}}</td>
                    <td>{{prod.stock}}</td>
                    <td>{{prod.idMarca}}</td> <td>{{prod.idCategoria}}</td>
                    <td>
                        <button class="btn-edit" (click)="editarProducto(prod)">Editar</button>
                        <button class="btn-delete" (click)="eliminarProducto(prod)">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<app-productosform [config]="modalConfig" (close)="cerrarModal()" (save)="accionProducto($event)"></app-productosform>
