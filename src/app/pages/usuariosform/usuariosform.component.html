<div *ngIf="config.visible" class="modal-overlay">
    <div class="modal-container">
        <h2>{{config.titulo}}</h2>

        <form [formGroup]="form" *ngIf="config.modo !== 'eliminar'">
            <div class="form-group">
                <label for="nombre">Nombre(s)</label>
                <input id="nombre" type="text" formControlName="nombre" class="form-input" />
            </div>

            <div class="form-group">
                <label for="apellidoP">Apellido Paterno</label>
                <input id="apellidoP" type="text" formControlName="apellidoP" class="form-input" />
            </div>

            <div class="form-group">
                <label for="apellidoM">Apellido Materno</label>
                <input id="apellidoM" type="text" formControlName="apellidoM" class="form-input" />
            </div>

            <div class="form-group">
                <label for="username">Nombre de Usuario (Username)</label>
                <input id="username" type="text" formControlName="username" class="form-input" />
            </div>

            <div class="form-group" *ngIf="config.modo === 'crear'">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password" class="form-input" />
            </div>
        </form>

        <div *ngIf="config.modo === 'eliminar'" style="margin-bottom: 20px; color: rgba(220, 220, 255, 0.85);">
            <p>¿Estás seguro de que deseas desactivar al usuario <strong>{{config.usuario?.nombre}}</strong>?</p>
        </div>
        
        <div class="actions">
            <button type="button" class="btn btn-cancel" (click)="cancelar()">Cancelar</button>
            <button type="submit" class="btn" [ngClass]="config.modo === 'eliminar' ? 'btn-action delete' : 'btn-save'" [disabled]="config.modo !== 'eliminar' && form.invalid" (click)="guardar()">
                {{config.modo === 'crear' ? 'Crear' : config.modo === 'editar' ? 'Actualizar' : 'Eliminar'}}
            </button>
        </div>
    </div>
</div>
