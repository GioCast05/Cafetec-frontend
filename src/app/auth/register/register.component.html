<form [formGroup]="formRegister" (ngSubmit)="registrar()">
  <input type="text"     placeholder="Nombre"          formControlName="nombre"    />
  <input type="text"     placeholder="Apellido Paterno" formControlName="apellidoP" />
  <input type="text"     placeholder="Apellido Materno" formControlName="apellidoM" />
  <input type="text"     placeholder="Username"         formControlName="username"  />
  <input type="password" placeholder="Password"         formControlName="password"  />
  <button type="submit">Registrarse</button>
</form>
