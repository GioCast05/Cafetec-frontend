<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Glow exterior -->
    <div class="card-glow"></div>

    <!-- Logo -->
    <div class="auth-brand">
      <div class="brand-icon">CT</div>
      <span class="brand-name">CafeTec</span>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="tab-btn" [class.active]="vista() === 'login'" (click)="vista.set('login')">
        Iniciar sesión
      </button>
      <button class="tab-btn" [class.active]="vista() === 'register'" (click)="vista.set('register')">
        Registrarse
      </button>
      <div class="tab-indicator" [class.right]="vista() === 'register'"></div>
    </div>

    <!-- ── LOGIN ── -->
    <form *ngIf="vista() === 'login'" [formGroup]="formLogin" (ngSubmit)="iniciarSesion()" class="auth-form">
      <div class="field">
        <label>Usuario</label>
        <input type="text" placeholder="Tu username" formControlName="username" />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" formControlName="password" />
      </div>
      <button type="submit" [disabled]="formLogin.invalid">
        <span>Entrar</span>
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M10 17l5-5-5-5v10z"/>
        </svg>
      </button>
    </form>

    <!-- ── REGISTER ── -->
    <form *ngIf="vista() === 'register'" [formGroup]="formRegister" (ngSubmit)="registrar()" class="auth-form">
      <div class="fields-row">
        <div class="field">
          <label>Nombre</label>
          <input type="text" placeholder="Nombre" formControlName="nombre" />
        </div>
        <div class="field">
          <label>Apellido Paterno</label>
          <input type="text" placeholder="Apellido P." formControlName="apellidoP" />
        </div>
      </div>
      <div class="field">
        <label>Apellido Materno</label>
        <input type="text" placeholder="Apellido M." formControlName="apellidoM" />
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" placeholder="Tu username" formControlName="username" />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" formControlName="password" />
      </div>
      <button type="submit" [disabled]="formRegister.invalid">
        <span>Crear cuenta</span>
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>
    </form>

  </div>
</div>
